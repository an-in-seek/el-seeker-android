org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# R8 full mode(기본 true)는 -keepattributes Signature 를 줘도 명시적으로 -keep
# 되지 않은(이름만 바뀐 채 유지되는) 클래스의 제네릭 시그니처를 제거한다.
# 그 결과 카카오 SDK 내부 Retrofit 서비스 인터페이스의 Call<Foo> 정보가 사라져
# "Call return type must be parameterized" 크래시가 발생했다.
# compat 모드에서는 Signature 가 유지되는 모든 클래스에 보존되어 문제가 해결된다.
android.enableR8.fullMode=false
